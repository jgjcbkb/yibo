
<!DOCTYPE html>

    <style>
        :root { --primary-green: #00b578; --dark-green: #008c5e; --light-green-bg: #e6f8f1; --text-dark: #2c3e50; --text-light: #7f8c8d; --bg-color: #f7fafc; --container-bg: #ffffff; --border-color: #e2e8f0; }
        html, body { scroll-behavior: smooth; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; }
        
        body.pseudo-fullscreen-active { overflow: hidden; }
        #import-file-input, #bobo-image-input, #cut-modal input[type="file"], #project-modal input[type="file"] { display: none !important; }

        #access-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 9999; display: flex;
            justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.5s ease-out;
        }
        .gate-content {
            background-color: var(--container-bg); padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%;
        }
        .gate-content h1 { margin-top: 0; color: var(--primary-green); }
        .gate-content p { font-size: 1.1rem; margin-bottom: 20px; }
        #gate-answer {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box;
        }
        #gate-answer:focus {
            outline: none; border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(0, 181, 120, 0.15);
        }
        .gate-message { margin-top: 20px; display: none; }
        .gate-message img { max-width: 100%; height: auto; border-radius: 8px; }

        .screen { display: none; animation: fadeIn 0.5s; } .screen.active { display: block; }
        .container { max-width: 900px; margin: 0 auto; background-color: var(--container-bg); padding: 25px 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        .main-content { padding: 20px; }
        .btn { background-color: var(--primary-green); color: white; border: none; padding: 10px 20px; font-size: 0.9rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { background-color: var(--dark-green); transform: translateY(-2px); }
        .btn.danger { background-color: #e53e3e; } .btn.danger:hover { background-color: #c53030; }
        .btn.secondary { background-color: #a0aec0; } .btn.secondary:hover { background-color: #718096; }
        .btn.icon-btn { padding: 8px 12px; }
        .screen-header { display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        .back-btn { font-size: 1.5rem; color: var(--text-light); cursor: pointer; margin-right: 15px; }
        .screen-header h1 { margin: 0; font-size: 1.8rem; } .screen-header p { margin: 5px 0 0; color: var(--text-light); }
        #home-screen .header { text-align: center; margin-bottom: 40px; } #home-screen h1 { font-size: 2.2rem; }
        .category-selection { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; }
        .category-card { background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .category-card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); border-color: var(--primary-green); }
        .category-card .icon { font-size: 3rem; color: var(--primary-green); margin-bottom: 15px; } .category-card h2 { margin: 0; }
        .project-list { list-style: none; padding: 0; }
        .project-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; transition: all 0.2s ease; }
        .project-item .project-info { cursor: pointer; flex-grow: 1; }
        .project-item:hover { border-color: var(--primary-green); background-color: var(--light-green-bg); }
        .project-info h3 { margin: 0; } .project-info p { margin: 5px 0 0; color: var(--text-light); font-size: 0.9rem; }
        .project-actions { display: flex; gap: 10px; }
        .add-project-bar { display: flex; justify-content: center; gap: 15px; padding: 20px 0; }
        #cut-editor-screen .empty-state { text-align: center; color: var(--text-light); padding: 50px 0; }
        #cut-editor-screen .episode-item { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
        
        #cut-editor-screen .episode-header { background-color: #fff; cursor: pointer; padding: 10px 20px; width: 100%; border: none; text-align: left; font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; transition: background-color 0.3s; border-bottom: 1px solid transparent; }
        #cut-editor-screen .episode-header.active { background-color: var(--light-green-bg); color: var(--dark-green); border-bottom-color: var(--border-color); }
        #cut-editor-screen .episode-header .icon { transition: transform 0.3s; color: var(--text-light); font-size: 1.5rem; }
        #cut-editor-screen .episode-header.active .icon { transform: rotate(180deg); color: var(--dark-green); }
        .header-controls { display: flex; align-items: center; gap: 10px; }

        #cut-editor-screen .episode-content { padding: 0; background-color: white; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        #cut-editor-screen .cut-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        #cut-editor-screen .cut-table th, .cut-table td { padding: 12px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        #cut-editor-screen .cut-table th:last-child, #cut-editor-screen .cut-table td:last-child { text-align: center; }
        #cut-editor-screen .cut-table .description-cell { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #cut-editor-screen .cut-table th { background-color: #fcfcfc; font-size: 0.9rem; color: var(--text-light); }
        #cut-editor-screen .cut-table tr:last-child td { border-bottom: none; }
        .play-link-btn { color: var(--primary-green); text-decoration: none; font-weight: 600; cursor: pointer; } .play-link-btn:hover { color: var(--dark-green); text-decoration: underline; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(5px); animation: fadeIn 0.3s; display: none; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: slideIn 0.4s; margin: 0; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-top: 0; color: var(--primary-green); }
        .close-btn { color: #aaa; position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; z-index: 1001;}
        
        .confirm-dialog { max-width: 400px; text-align: center; }
        .confirm-dialog .fas { font-size: 2.5rem; color: #e53e3e; margin-bottom: 15px; }
        .confirm-dialog h2 { color: var(--text-dark); }
        .confirm-dialog p { color: var(--text-light); margin-bottom: 25px; font-size: 1rem; }
        .confirm-actions { display: flex; justify-content: center; gap: 15px; }
        
        .form label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form input, .form textarea { width: 100%; padding: 12px; margin-bottom: 18px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; }
        .form input:focus, .form textarea:focus { outline: none; border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(0, 181, 120, 0.15); }
        .form textarea { resize: vertical; min-height: 90px; } .form .btn { width: 100%; } .form-field { display: block; }
        .source-type-chooser { display: flex; gap: 20px; margin-bottom: 18px; } .source-type-chooser label { font-weight: normal; }
        .kebab-menu-container { position: relative; display: inline-block; }
        .kebab-toggle { background: none; border: none; font-size: 1.2rem; color: var(--text-light); cursor: pointer; padding: 5px; border-radius: 50%; }
        .kebab-toggle:hover { background-color: var(--border-color); }
        .kebab-dropdown { display: none; position: absolute; right: 0; top: 100%; background-color: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 10; overflow: hidden; min-width: 100px; }
        tr:last-child .kebab-dropdown { top: auto; bottom: 100%; }
        .kebab-dropdown.active { display: block; }
        .kebab-dropdown button { display: block; width: 100%; padding: 10px 15px; border: none; background: none; text-align: left; cursor: pointer; }
        .kebab-dropdown button:hover { background-color: var(--light-green-bg); } .kebab-dropdown button.danger { color: #e53e3e; }
        
        #play-screen { background-color: var(--container-bg); }
        .play-screen-header { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border-color); }
        .play-area-layout { padding: 0 20px 20px; }
        #play-screen .player-wrapper { position: sticky; top: 0; z-index: 100; }
        @media (min-width: 992px) { .play-area-layout { display: flex; align-items: flex-start; gap: 20px; } #play-screen .player-wrapper { flex: 2; } #play-screen .info-and-playlist { flex: 1; padding: 0; } }
        #play-screen .player-container { width: 100%; max-width: 100%; position: relative; overflow: hidden; background-color: #000; }
        #play-screen .player-container video { width: 100%; aspect-ratio: 16/9; display: block; object-fit: contain; }
        #play-screen .player-container.pseudo-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; }
        .player-container.pseudo-fullscreen video { aspect-ratio: auto; height: 100%; width: 100%; object-fit: contain; }
        #player-container:-webkit-full-screen video, #player-container:fullscreen video { height: 100%; width: 100%; object-fit: contain; }
        body.pseudo-fullscreen-active .play-screen-header, body.pseudo-fullscreen-active .info-and-playlist { display: none; }
        body.pseudo-fullscreen-active .play-area-layout { padding: 0; }
        .orientation-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1001; color: white; text-align: center; font-size: 1.1rem; }
        .orientation-message i { font-size: 4rem; margin-bottom: 1rem; display: block; animation: rotate-phone 2s infinite ease-in-out; }
        @keyframes rotate-phone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); opacity: 1; } }
        .player-container.pseudo-fullscreen.portrait .orientation-overlay { display: flex; }
        #play-screen .info-and-playlist { padding: 20px 0; }
        .play-info-box { margin-bottom: 25px; } .play-info-box h2 { font-size: 1.5rem; margin: 0 0 10px; } .play-info-box p { font-size: 1rem; color: var(--text-dark); line-height: 1.8; white-space: pre-wrap; margin: 0; }
        .playlist-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; border-left: 4px solid var(--primary-green); padding-left: 10px; }
        .playlist-cuts { list-style: none; padding: 0; margin: 0; max-height: 50vh; overflow-y: auto; }
        .playlist-item { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; border-bottom: 1px solid var(--border-color); }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item.playing, .playlist-item:hover { background-color: var(--light-green-bg); }
        .playlist-item .part { font-weight: bold; font-size: 1.1rem; color: var(--primary-green); flex-shrink: 0; }
        .playlist-item.playing .part { font-weight: bold; }
        
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
        .center-controls { grid-column: 2 / 3; display: flex; align-items: center; gap: 40px; pointer-events: all; transition: opacity 0.3s; z-index: 2; }
        .seek-overlay { grid-row: 1 / 2; pointer-events: all; z-index: 1; } .seek-overlay.left { grid-column: 1 / 2; } .seek-overlay.right { grid-column: 3 / 4; }
        .seek-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background-color: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; font-size: 1.5rem; opacity: 0; transition: opacity 0.3s; z-index: 5; pointer-events: none; }
        .seek-indicator.show { opacity: 1; }
        .custom-controls, .center-controls { opacity: 0; transition: opacity 0.3s ease-in-out; }
        .player-container.controls-visible .custom-controls, .player-container.controls-visible .center-controls { opacity: 1; }
        .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 5px 10px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); color: #fff; display: flex; flex-direction: column; pointer-events: none; z-index: 3; }
        .player-container.controls-visible .custom-controls { pointer-events: all; }
        .progress-bar-container { width: 100%; margin-bottom: 5px; }
        input[type="range"].progress-bar { width: 100%; height: 5px; -webkit-appearance: none; background: rgba(255,255,255,0.3); outline: none; transition: height 0.2s; cursor: pointer; }
        input[type="range"].progress-bar:hover { height: 8px; }
        input[type="range"].progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 63px; height: 63px; background-image: url('https://i.postimg.cc/rm8SSHDT/IMG-7838.png'); background-size: contain; background-repeat: no-repeat; background-position: center; border: none; border-radius: 0; background-color: transparent; }
        input[type="range"].progress-bar::-moz-range-thumb { width: 63px; height: 63px; background-image: url('https://i.postimg.cc/rm8SSHDT/IMG-7838.png'); background-size: contain; background-repeat: no-repeat; background-position: center; border: none; border-radius: 0; background-color: transparent; }
        .controls-main { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 10px; }
        .control-btn { background: none; border: none; color: #fff; font-size: 1rem; cursor: pointer; padding: 5px; }
        .speed-btn { font-size: 0.9rem; font-weight: bold; width: 45px; }
        .time-display { font-size: 0.85rem; }
        .volume-container { display: flex; align-items: center; }
        input[type="range"].volume-slider { width: 70px; height: 4px; background: #fff; }
        @font-face { font-family: 'MyCoolPixelFont'; src: url('https://image.uglycat.cc/51ftco.ttf') format('truetype'); font-display: swap; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: none; justify-content: center; align-items: center; z-index: 4; pointer-events: none; }
        .player-container.loading .loading-overlay { display: flex; }
        .loading-overlay .image-container { width: 33.333%; height: 0; padding-bottom: calc(33.333% * (644 / 834)); background-image: url('https://i.postimg.cc/25qpCHkc/IMG-7840.png'); background-size: contain; background-repeat: no-repeat; background-position: center; position: relative; }
        .loading-overlay .loading-text { position: absolute; top: calc(508 / 644 * 100%); left: calc(42 / 834 * 100%); width: calc((795 - 42) / 834 * 100%); height: calc((624 - 508) / 644 * 100%); display: flex; justify-content: center; align-items: center; font-family: 'MyCoolPixelFont', sans-serif; font-size: clamp(6px, 1.3vw, 12px); color: #5a4e47; white-space: nowrap; }
        .loading-overlay .ellipsis span { animation: blink-animation 1.4s infinite; opacity: 0; } .loading-overlay .ellipsis span:nth-child(2) { animation-delay: 0.2s; } .loading-overlay .ellipsis span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink-animation { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .site-footer { text-align: center; padding: 40px 20px 20px; font-size: 0.8rem; color: var(--text-light); display: none; }
        #batch-add-modal .form textarea { min-height: 200px; font-family: monospace; }

        #batch-add-modal .format-instructions p { margin: 5px 0; }

        .settings-item-group { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        .settings-item-group label { color: var(--text-light); }
        .settings-item-group input[type=number] { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid var(--border-color); text-align: center; }
        .data-management-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        #resume-prompt { position: fixed; bottom: 20px; right: 20px; background-color: var(--container-bg); color: var(--text-dark); padding: 15px 20px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); z-index: 1002; display: flex; align-items: center; gap: 15px; opacity: 0; transform: translateY(20px); animation: slideUpFadeIn 0.5s forwards; }
        #resume-prompt .info h4 { margin: 0 0 5px; font-size: 0.95rem; } #resume-prompt .info p { margin: 0; font-size: 0.8rem; color: var(--text-light); }
        #resume-prompt .resume-btn { font-size: 1.5rem; color: var(--primary-green); cursor: pointer; }
        #resume-prompt .close-resume-btn { font-size: 1.2rem; color: var(--text-light); cursor: pointer; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} } @keyframes slideIn { from {transform: translateY(-50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} } @keyframes slideUpFadeIn { from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);} }
        .open-closet-btn { width: 140px; height: 140px; background-image: url('https://i.postimg.cc/8CF8TypR/IMG-7859.png'); background-size: contain; background-repeat: no-repeat; cursor: pointer; border: none; background-color: transparent; animation: pulse-animation 2s infinite ease-in-out; flex-shrink: 0; }

        .closet-title { font-size: 2.5rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .close-modal-btn { font-size: 2.5rem; cursor: pointer; background: none; border: none; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .closet-footer { padding-top: 15px; text-align: center; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .closet-footer .btn { background-color: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: background-color 0.3s; }

        .preview-wrapper { width: 288px; height: 231px; flex-shrink: 0; }

        #url-prompt-modal { z-index: 2001; }
        #url-prompt-modal .modal-content { max-width: 450px; }
        #url-prompt-modal .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        #url-prompt-modal .form-actions .btn { width: auto; }

            const timeElement = document.createElement('div');
            timeElement.className = 'time-stamp';
            timeElement.textContent = time;
            chatArea.appendChild(timeElement);
            // 新增：保存时间戳
            chatHistory.push({ type: 'timestamp', content: time });
            saveHistory();
            messageTimeInput.value = '';
        }

        let messageContentHTML = '';
        const type = messageTypeSelect.value;
        switch (type) {
            case 'text': const content = messageContentInput.innerHTML.trim(); if (!content) return; messageContentHTML = `<div class="message-bubble text-bubble">${content}</div>`; messageContentInput.innerHTML = ''; break;
            case 'payment': const state = paymentStateSelect.value, isFinished = !state.includes('active') && !state.includes('sent'); const isPacket = state.includes('red-packet'), pTitle = paymentTitleInput.value.trim() || (isPacket ? '恭喜发财, 大吉大利' : '¥0.00'), pSubtitle = paymentSubtitleInput.value.trim(); let statusText = '', iconUrl = ''; if(isPacket) { iconUrl = isFinished ? paymentIcons.packet_done : paymentIcons.packet; if(state === 'red-packet-claimed') statusText = '已领取'; if(state === 'red-packet-expired') statusText = '已过期'; } else { switch(state) { case 'transfer-sent-me': statusText = '你发起了一笔转账'; iconUrl = paymentIcons.sent; break; case 'transfer-sent-other': statusText = '请收款'; iconUrl = paymentIcons.sent; break; case 'transfer-collected': statusText = '已收款'; iconUrl = paymentIcons.received; break; case 'transfer-received-passive': statusText = '已被接收'; iconUrl = paymentIcons.received; break; case 'transfer-returned-active': statusText = '已退还'; iconUrl = paymentIcons.returned; break; case 'transfer-returned-passive': statusText = '已被退还'; iconUrl = paymentIcons.returned; break; case 'transfer-expired': statusText = '已过期'; iconUrl = paymentIcons.expired; break; } } messageContentHTML = `<div class="message-bubble payment-bubble ${isFinished ? 'is-finished' : ''}"><div class="payment-content"><img src="${iconUrl}" class="payment-icon"><div class="payment-text"><div class="title">${pTitle}</div>${statusText ? `<div class="card-status">${statusText}</div>` : ''}${pSubtitle ? `<div class="subtitle">${pSubtitle}</div>` : ''}</div></div><div class="card-footer">${isPacket ? '微信红包' : '微信转账'}</div></div>`; break;
            case 'location': const lTitle = locationTitleInput.value.trim() || '位置信息', lAddress = locationAddressInput.value.trim(); messageContentHTML = `<div class="message-bubble location-bubble"><div class="location-text"><div class="title">${lTitle}</div>${lAddress ? `<div class="address">${lAddress}</div>` : ''}</div><div class="card-map-area"><div class="card-pin-icon"></div></div></div>`; break;
            case 'gift': const gName = giftNameInput.value.trim() || 'Apple iPhone 16', gState = giftStateSelect.value, isGiftFinished = gState !== 'sent'; let giftStatusText = ''; if(gState === 'accepted') giftStatusText = '已收下'; if(gState === 'expired') giftStatusText = '已过期'; messageContentHTML = `<div class="message-bubble gift-bubble ${isGiftFinished ? 'is-finished' : ''}"><div class="gift-content"><div class="gift-icon"></div><div class="gift-text"><div class="gift-name">${gName}</div>${giftStatusText ? `<div class="card-status">${giftStatusText}</div>` : ''}</div></div><div class="card-footer">微信礼物</div></div>`; break;

            case 'image': if(!sharedImageDataUrl) { alert('请先选择要发送的图片'); return; } const imageClass = isStickerCheckbox.checked ? 'shared-sticker' : 'shared-image'; messageContentHTML = `<img src="${sharedImageDataUrl}" class="${imageClass}">`; sharedImageDataUrl = null; imageUpload.value = ''; isStickerCheckbox.checked = false; break;
        }
        if (!messageContentHTML) return;
        
        const senderId = senderSelect.value; const isSingleMode = modeSingleRadio.checked; const senderIsMe = senderId === 'my'; let sender;
        if (senderIsMe) { sender = { name: '我', avatarUrl: myAvatarDataUrl || defaultMyAvatar }; } else if (isSingleMode) { sender = { name: opponentNameInput.value, avatarUrl: opponentAvatarDataUrl || defaultOpponentAvatar }; } else { sender = groupMembers.find(m => m.id == senderId); }
        if (!sender) return;
        
        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${senderIsMe ? 'my-message' : 'other-message'}`;
        const senderNameHTML = !senderIsMe && !isSingleMode ? `<div class="sender-name">${sender.name}</div>` : '';
        messageRow.innerHTML = `
            <img src="${sender.avatarUrl}" class="avatar">
            <div class="content-wrapper">
                ${senderNameHTML}
                ${messageContentHTML}
            </div>
        `;
        chatArea.appendChild(messageRow);
        chatArea.scrollTop = chatArea.scrollHeight;

        // 新增：保存消息
        chatHistory.push({
            type: 'message',
            isMe: senderIsMe,
            avatarUrl: sender.avatarUrl,
            senderName: (!senderIsMe && !isSingleMode) ? sender.name : null,
            contentHTML: messageContentHTML
        });
        saveHistory();
    });

    function onEmojiClick(event) {
        const emojiUrl = event.target.src;
        if (!emojiUrl) return;
        const emojiImgTag = `<img src="${emojiUrl}" class="inline-emoji" alt="emoji">`;
        messageContentInput.focus();
        document.execCommand('insertHTML', false, emojiImgTag);
    }

    function populateEmojiPalette() {
        emojiPalette.innerHTML = '';
        wechatEmojiUrls.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.addEventListener('click', onEmojiClick);
            emojiPalette.appendChild(img);
        });
    }
    
    // 预览模式切换
    previewBtn.addEventListener('click', () => {
        document.body.classList.add('preview-mode-active');
        alert('已进入预览模式。\n\n现在你可以使用手机自带的截屏功能进行截图，这样最清晰。\n\n双击手机屏幕任何地方即可退出预览。');
    });

    // 双击手机区域退出预览
    phonePreview.addEventListener('dblclick', () => {
        document.body.classList.remove('preview-mode-active');
    });

    // 外壳显示控制
    showShellCheckbox.addEventListener('change', () => {
        if (showShellCheckbox.checked) {
            phonePreview.classList.remove('no-shell');
        } else {
            phonePreview.classList.add('no-shell');
        }
    });

    // 刘海显示控制
    showNotchCheckbox.addEventListener('change', () => {
        if (showNotchCheckbox.checked) {
            phonePreview.classList.remove('no-notch');
        } else {
            phonePreview.classList.add('no-notch');
        }
    });

    // 修正：清空按钮逻辑
    clearChatBtn.addEventListener('click', () => {
        if (chatArea.innerHTML.trim() === '') { return; }
        showConfirmModal(
            '确认清空',
            '您确定要清空所有聊天记录吗？此操作无法撤销。',
            () => {
                chatArea.innerHTML = '';
                chatHistory = []; // 清空内存中的数组
                localStorage.removeItem(STORAGE_KEY); // 从 localStorage 删除
                closeModal('confirm-modal');
            }
        );
    });
    
    loadHistory(); 
    updateChatMode();
    populateEmojiPalette();
}

nload = fullDownloadName; downloadLink.className = 'download-link'; gridItem.appendChild(checkbox); gridItem.appendChild(imgElement); gridItem.appendChild(downloadLink); gridContainer.appendChild(gridItem); } } } selectAllCheckbox.addEventListener('change', () => { document.querySelectorAll('#image-slicer-screen .slice-checkbox').forEach(cb => { cb.checked = selectAllCheckbox.checked; }); }); downloadSelectedButton.addEventListener('click', async () => {
