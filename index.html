            function initBoboClosetApp() { const b=document.getElementById("bobo-image-input"),c=document.getElementById("closet-modal"),x=document.getElementById("close-closet-btn"),s=document.getElementById("continue-select-btn"),a=document.getElementById("add-by-link-btn"),u=document.getElementById("url-prompt-modal"),f=document.getElementById("url-prompt-form"),n=document.getElementById("url-prompt-cancel-btn"),i=document.getElementById("image-url-input");x.addEventListener("click",()=>c.style.display="none");s.addEventListener("click",()=>b.click());a.addEventListener("click",()=>{i.value="";openModal("url-prompt-modal")});n.addEventListener("click",()=>closeModal("url-prompt-modal"));f.addEventListener("submit",e=>{e.preventDefault();const url=i.value.trim();if(url){createFramedPreviewInCloset(url);closeModal("url-prompt-modal")}});b.addEventListener("change",e=>{if(e.target.files&&e.target.files.length>0){for(const file of e.target.files){const r=new FileReader;r.onload=e=>createFramedPreviewInCloset(e.target.result);r.readAsDataURL(file)}}e.target.value=null})}
            function initCloset(p, k) {
